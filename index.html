</style></head><body>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),dlg=$('#dlg'),dlg2=$('#dlg2');

sa.ontimeupdate=()=>{ss.value=sa.currentTime;ss.style.setProperty('--v',sa.duration?sa.currentTime/sa.duration*100+'%':'0%');$('#st').textContent=tm(sa.currentTime);mark()};
sa.onplay=sa.onpause=()=>$('#sp1').textContent=sa.paused?'▶ Play':'❚❚ Pause';
$('#sp1').onclick=()=>sa.paused?sa.play():sa.pause();$('#sb').onclick=()=>sa.currentTime=Math.max(0,sa.currentTime-2);$('#sf').onclick=()=>sa.currentTime+=2;
ss.oninput=()=>sa.currentTime=ss.value;$('#sr2').onchange=e=>sa.playbackRate=+e.target.value;
$('#stamp').onclick=()=>stamp(nx);$('#undo').onclick=()=>{const h=hist.pop();if(h){L[h[0]].t=h[1];nx=h[0];draw();scr()}};
$('#addl').onclick=()=>{L.push({t:null,tx:''});nx=L.length-1;draw();scr();sl.lastElementChild.querySelector('[data-a=x]').focus()};
$('#srt').onclick=()=>{L.sort((a,b)=>(a.t??1e9)-(b.t??1e9));nx=Math.max(0,L.findIndex(l=>l.t==null));draw()};
sl.onclick=e=>{const b=e.target.closest('button'),r=e.target.closest('.sr');if(!b||!r)return;const i=+r.dataset.i,a=b.dataset.a;if(a==='j'){if(L[i].t!=null){sa.currentTime=Math.max(0,L[i].t-.3);sa.play()}}else if(a==='s')stamp(i);else if(a==='d'){L.splice(i,1);if(nx>i)nx--;draw()}};
sl.onchange=e=>{const r=e.target.closest('.sr');if(!r)return;const i=+r.dataset.i;if(e.target.dataset.a==='t'){const v=P(e.target.value);L[i].t=v;e.target.value=v==null?'':fmt(v);mark()}else L[i].tx=e.target.value};
sl.addEventListener('focusin',e=>{const r=e.target.closest('.sr');if(r&&e.target.tagName==='INPUT'){nx=+r.dataset.i;[...sl.children].forEach((x,k)=>x.classList.toggle('nx',k===nx))}});
$('#c2').onclick=()=>dlg2.close();
$('#ok2').onclick=()=>{L=L.filter(l=>l.tx.trim());const n=L.filter(l=>l.t==null).length;dlg2.close();done(L.map(l=>l.t==null?l.tx.trim():`[${fmt(l.t)}] ${l.tx.trim()}`).join('\n'),n)};
dlg2.onclose=()=>{sa.pause();sa.removeAttribute('src')};
dlg2.onkeydown=e=>{const g=e.target.tagName;if(g==='INPUT'||g==='SELECT')return;if(e.key==='t'||e.key==='T'){e.preventDefault();stamp(nx)}else if(e.code==='Space'&&g!=='BUTTON'){e.preventDefault();sa.paused?sa.play():sa.pause()}};
draw();scr();dlg2.showModal()}
$('#et').onclick=async()=>{if(!admin)return;const s=song();if(!s)return toast('Play a song first, then open its timeline.');const u=await src(s);if(!u)return toast('The audio file for this song is missing.');syncDlg(u,s.lrc||'',(v,n)=>{s.lrc=v;save();build();toast(n?n+' line(s) have no time yet and will not show.':'Timeline saved')})};
function bannerDlg(id){if(!admin)return;dlg.dataset.a='';const old=D.banners.find(x=>x.id===id),b=old||{id:'b'+Date.now(),title:'',sub:'',song:'',g:Math.random()*5|0};
dlg.innerHTML=`<h3>${old?'Edit banner':'Add banner'}</h3><label>Headline<input id="f1" value="${esc(b.title)}"></label><label>Subtitle<input id="f2" value="${esc(b.sub)}"></label><label>Banner image (wide photos look best)<input id="f3" type="file" accept="image/*"></label><label>Song to play from this banner<select id="f4"><option value="">None</option>${D.songs.map(s=>`<option value="${s.id}"${s.id===b.song?' selected':''}>${esc(s.title)}</option>`).join('')}</select></label><div class="row"><button class="btn o" id="x">Cancel</button>${old?'<button class="btn o" id="dd">Delete banner</button>':''}<button class="btn" id="ok">Save banner</button></div>`;
dlg.showModal();$('#x').onclick=()=>dlg.close();
if(old)askDel($('#dd'),()=>{D.banners=D.banners.filter(x=>x.id!==id);bi=0;save();dlg.close();hero();toast('Banner deleted')});
$('#ok').onclick=async()=>{const t=$('#f1').value.trim(),c=$('#f3').files[0];if(!t)return toast('Please enter a headline');
b.title=t;b.sub=$('#f2').value.trim();b.song=$('#f4').value;if(c)b.cover=await img(c,1400);if(!old)D.banners.push(b);save();dlg.close();hero();toast('Banner saved')}}
const ply=document.querySelector('.pl'),setPh=()=>document.documentElement.style.setProperty('--ph',ply.offsetHeight+12+'px');if(window.ResizeObserver)new ResizeObserver(setPh).observe(ply);addEventListener('resize',setPh);setPh();
applyTheme();adm();hero();ui();build();setTimeout(()=>D.songs.forEach(s=>src(s)),400);
</script></body></html>
